<!doctype html>
<html lang="hi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>धैर्य</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #f8f5ef;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        color: #222;
      }

      .container {
        text-align: center;
        padding: 20px;
        animation: fadeIn 1s ease-in;
      }

      .quote {
        font-size: 1.6rem;
        margin-bottom: 20px;
      }

      .countdown {
        font-size: 1rem;
        color: #555;
        letter-spacing: 0.5px;
      }

      .reveal {
        margin-top: 18px;
      }

      .reveal a {
        display: inline-block;
        padding: 10px 20px;
        border-radius: 999px;
        border: 1px solid #222;
        color: #222;
        text-decoration: none;
        font-size: 0.95rem;
        letter-spacing: 0.4px;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }

      .reveal a:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.1);
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="quote">सब्र का फल मीठा होता है</div>
      <div class="countdown" id="countdown"></div>
      <div class="reveal" id="reveal" hidden>
        <a href="./message.html">click here</a>
      </div>
    </div>

    <script>
      const targetDate = new Date("May 10, 2026 22:00:00").getTime();

      function updateCountdown() {
        const now = new Date().getTime();
        const diff = targetDate - now;

        if (diff <= 0) {
          document.getElementById("countdown").innerText =
            "thanks for waiting :)";
          document.getElementById("reveal").hidden = false;
          return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        document.getElementById("countdown").innerText =
          `${days}d ${hours}h ${minutes}m ${seconds}s`;
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    </script>
  </body>
</html>
